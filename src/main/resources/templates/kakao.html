<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카카오 로그인 테스트</title>
</head>
<body>
<h1>로그인 처리 중...</h1>
<p id="message"></p>

<script>
    // 현재 페이지의 URL에서 'code' 파라미터 값을 추출합니다.
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    // 여러분의 백엔드 API 주소입니다.
    const backendApiUrl = `http://13.124.147.207:9000/v1/auth/kakao?code=${code}`;

    if (code) {
        console.log("백엔드 API 호출 시작:", backendApiUrl);
        document.getElementById("message").innerText = "백엔드에 토큰을 요청하고 있습니다...";

        // fetch API를 사용하여 백엔드에 요청을 보냅니다.
        fetch(backendApiUrl, {
            // ★★★★★ cross-origin 요청에서 쿠키를 받기 위한 필수 옵션!
            credentials: 'include'
        })
            .then(response => {
                // 응답이 성공적인지 확인합니다.
                if (!response.ok) {
                    throw new Error(`HTTP 에러! 상태: ${response.status}`);
                }
                return response.json(); // 응답을 JSON 형태로 파싱합니다.
            })
            .then(data => {
                // 성공적으로 데이터를 받았을 때의 처리
                console.log("백엔드로부터 받은 데이터:", data);
                document.getElementById("message").innerText = "로그인 성공! 개발자 도구 콘솔과 쿠키를 확인하세요.";
                // 실제 프론트엔드라면 여기서 메인 페이지로 이동시킵니다.
                // window.location.href = '/main';
            })
            .catch(error => {
                // 에러 처리
                console.error("API 호출 중 에러 발생:", error);
                document.getElementById("message").innerText = `에러 발생: ${error.message}`;
            });
    } else {
        document.getElementById("message").innerText = "URL에 카카오 인가 코드가 없습니다.";
    }
</script>
</body>
</html>
